services:
  # 1. Next.js 16 Web Command Center & Cosmos.AI Gateway
  - type: web
    name: verisettle-web
    env: node
    plan: standard
    # Exactly one instance: restock state, payment claims and the per-order payment lock live in this
    # process's memory. A second instance would not see the first one's lock (double capture risk).
    # Scaling out requires moving that state to a database with a row lock first.
    numInstances: 1
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npx next start -p $PORT -H 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NPM_FLAGS
        value: --legacy-peer-deps
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: RECEIPT_SIGNING_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Signs login session cookies (falls back to a key derived from OPERATOR_API_KEY if unset).
      - key: AUTH_SECRET
        generateValue: true
      # Optional Google sign-in. Add the redirect URI
      # https://<your-domain>/api/auth/google/callback to the Google OAuth client.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Public URL used for auth redirects, e.g. https://verisettle-web.onrender.com (no trailing slash).
      - key: APP_BASE_URL
        sync: false
      # Operator credential for privileged/mutating API routes (send as "Authorization: Bearer <key>").
      - key: OPERATOR_API_KEY
        generateValue: true
      # Sandbox demo only: lets same-origin browser clicks drive the guarded demo routes. Ignored
      # unless PAYPAL_ENVIRONMENT=SANDBOX. Remove this line for any non-demo deployment.
      - key: ALLOW_PUBLIC_DEMO_WRITES
        value: "true"
      # Enables the Judge 1-Click Live Test Bar (/api/test-bar). Sandbox demo only; the route is
      # still guarded by the operator key / same-origin demo policy. Remove for non-demo deployments.
      - key: ENABLE_TEST_BAR
        value: "true"
      - key: AI_DAILY_CALL_CAP
        value: "60"
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: verisettle-ml
          property: host
      - key: ML_MODE
        value: cached

  # 2. Python FastAPI ML/DL Microservice (LayoutLMv3 + XGBoost + GNN/LSTM)
  - type: web
    name: verisettle-ml
    env: python
    plan: standard
    buildCommand: cd ml_service && pip install -r requirements.txt
    startCommand: cd ml_service && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false

